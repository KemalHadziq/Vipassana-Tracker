<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mindful Buddy UI Template</title>
<meta name="description" content="Static UI template of every screen in Mindful Buddy. Markup and styles only, no app logic.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap" rel="stylesheet">
<!--
  UI TEMPLATE ONLY. This file holds the visual design of every screen: tokens, components and static markup.
  It has no behaviour. The working app is index.html, which uses the same styles.
  Dark mode: follows the system setting. To force it, put data-theme="dark" (or "light") on the <html> tag.
-->
<style>
/* ===== app styles (identical to index.html) ===== */

/* ===== tokens ===== */
:root{
  --bg:#f2f2ee;--surface:#ffffff;--surface-2:#e9eae4;--ink:#171c1a;--mute:#5b625e;--line:#e1e2dc;--line-2:#cdd0c8;
  --accent:#2c6b5f;--on-accent:#ffffff;
  --ana:#2c6b5f;--vip:#a8660f;--met:#a24a68;
  --h0:#e9eae4;--h1:#cfe2dc;--h2:#93c0b4;--h3:#4f8f80;--h4:#2c6b5f;--h-ink:#ffffff;
  --flame:#e8a33a;--flame-in:#f8dc8c;--diya:#9a6332;
  --warn-bg:#fbf0dc;--warn-line:#e0b25e;--err:#b3412f;
  --night:#1c2826;--night-2:#2a3835;--night-ink:#eef2ef;--night-mute:#a9b8b3;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111514;--surface:#181d1c;--surface-2:#212726;--ink:#e8ece9;--mute:#9aa49f;--line:#283030;--line-2:#36403e;
  --accent:#6cb8a6;--on-accent:#0d1514;
  --ana:#6cb8a6;--vip:#e2a54e;--met:#df8fab;
  --h0:#212726;--h1:#1f3d36;--h2:#2b5c51;--h3:#428a7a;--h4:#6cb8a6;--h-ink:#0d1514;
  --diya:#c38a55;--warn-bg:#30281a;--warn-line:#8a6a2c;--err:#ef8a78;
  --night:#0b0f0e;--night-2:#1a2220;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111514;--surface:#181d1c;--surface-2:#212726;--ink:#e8ece9;--mute:#9aa49f;--line:#283030;--line-2:#36403e;
  --accent:#6cb8a6;--on-accent:#0d1514;
  --ana:#6cb8a6;--vip:#e2a54e;--met:#df8fab;
  --h0:#212726;--h1:#1f3d36;--h2:#2b5c51;--h3:#428a7a;--h4:#6cb8a6;--h-ink:#0d1514;
  --diya:#c38a55;--warn-bg:#30281a;--warn-line:#8a6a2c;--err:#ef8a78;
  --night:#0b0f0e;--night-2:#1a2220;
  color-scheme:dark}

/* ===== base ===== */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Figtree,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
.app{max-width:600px;margin:0 auto;padding:calc(8px + env(safe-area-inset-top,0px)) 16px calc(96px + env(safe-area-inset-bottom,0px))}
h1{font:600 1.75rem/1.15 Fraunces,Georgia,serif;letter-spacing:-.01em;margin:0}
h2{font-size:1.05rem;font-weight:600;line-height:1.3;margin:0}
h3{font-size:.95rem;font-weight:600;margin:0}
p{margin:0}
.note{font-size:.875rem;color:var(--mute)}
.lead{color:var(--mute);margin-top:4px}
a{color:var(--accent);font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--vip);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.top{display:flex;align-items:center;gap:10px;height:52px}
.mark{width:28px;height:28px;flex:none}
.brand{font-weight:700;letter-spacing:-.01em}
.top .note{margin-left:auto}
.hello{margin:10px 0 16px;display:flex;gap:14px;align-items:center}
.hello .lamp{width:56px;height:56px;flex:none}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:12px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.stack>*+*{margin-top:12px}
.split{display:flex;justify-content:space-between;align-items:baseline;gap:10px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font-weight:600;cursor:pointer;transition:transform .12s ease,background-color .15s ease}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.text{border-color:transparent;background:transparent;color:var(--accent);padding:0 10px}
.btn.text:hover{background:var(--surface-2)}
.btn.small{min-height:36px;padding:0 14px;font-size:.9rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.ib{width:40px;height:40px;border-radius:50%;border:1px solid var(--line-2);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none;font-size:1.25rem;line-height:1}
.ib:hover{background:var(--surface-2)}.ib:disabled{opacity:.35;cursor:not-allowed}
.ib svg{width:18px;height:18px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.center{justify-content:center}

/* chips and segmented */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line-2);background:transparent;cursor:pointer;font-weight:500;font-size:.92rem}
.chips button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.seg{display:flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px}
.seg button{flex:1;min-height:36px;border:0;border-radius:999px;background:transparent;cursor:pointer;font-weight:600;font-size:.9rem;color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}

/* switch rows */
.opt{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--line)}
.opt:first-child{border-top:0;padding-top:2px}
.opt .txt{flex:1;min-width:0}
.opt .txt p{font-size:.875rem;color:var(--mute);margin-top:2px}
.opt .more{margin-top:12px}
.switch{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:999px;background:var(--line-2);position:relative;cursor:pointer;flex:none;margin:2px 0 0;transition:background-color .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.switch:checked{background:var(--accent)}
.switch:checked::after{transform:translateX(18px)}

/* fields */
label.f{display:block;font-weight:600;font-size:.9rem;margin:14px 0 6px}
label.f span{float:right;font-weight:400;color:var(--mute)}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=number],input[type=time],input[type=text],select,textarea{min-height:44px;padding:8px 12px;border:1px solid var(--line-2);border-radius:12px;background:var(--bg)}
textarea{width:100%;min-height:0;resize:vertical}
.w100{width:100%}
.tm{display:flex;gap:8px;align-items:center;margin:6px 0}.tm input{flex:1}

/* timer */
.ring{position:relative;width:min(250px,68vw);aspect-ratio:1;margin:8px auto 6px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.time{font:400 3.1rem/1 Fraunces,Georgia,serif;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.ph{font-weight:600;margin-top:8px}
.guide{color:var(--mute);min-height:3.1em;margin:4px auto 14px;max-width:42ch;text-align:center;font-size:.95rem}
.segs{display:flex;gap:4px;height:8px;margin:0 0 6px}
.segs i{display:block;border-radius:4px;background:var(--surface-2);overflow:hidden}
.segs b{display:block;height:100%;width:0}
.seglab{display:flex;gap:4px;font-size:.75rem;color:var(--mute);margin-bottom:14px}
.seglab span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}

/* custom editor */
.cust{border:0;margin:12px 0 0;padding:14px;background:var(--surface-2);border-radius:14px}
.cust legend{float:left;width:100%;padding:0;font-weight:600;font-size:.95rem;margin-bottom:6px}
.crow{display:flex;align-items:center;gap:8px;padding:6px 0;clear:both}
.cname{flex:1;display:flex;align-items:center;gap:8px;font-weight:500;line-height:1.25;min-width:0}
.cname i{width:10px;height:10px;border-radius:50%;flex:none}
.cname small{display:block;color:var(--mute);font-weight:400;font-size:.78rem;line-height:1.2}
.crow input{width:64px;text-align:center;font-variant-numeric:tabular-nums;background:var(--surface)}
.crow input[aria-invalid="true"]{border-color:var(--err);outline-color:var(--err)}
.crow .ib{background:var(--surface)}
.unit{color:var(--mute);font-size:.875rem;width:28px}
.cmsg{font-size:.875rem;color:var(--mute);margin-top:6px}
.cmsg.err{color:var(--err);font-weight:600}
.cust:disabled{opacity:.6}

/* goal bar */
.bar{height:8px;background:var(--surface-2);border-radius:6px;overflow:hidden;margin:8px 0 14px}
.bar i{display:block;height:100%;background:var(--accent);width:0;border-radius:6px}

/* calendar */
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.wk div{font-size:.75rem;color:var(--mute)}
.wk span{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;margin:0 auto 4px;background:var(--h0);font-size:.8rem;font-weight:600;color:var(--ink)}
.wk .td{color:var(--ink);font-weight:700}
.wk .td span{outline:2px solid var(--accent);outline-offset:2px}
.lv1{background:var(--h1)!important}.lv2{background:var(--h2)!important}
.lv3{background:var(--h3)!important;color:var(--h-ink)!important}.lv4{background:var(--h4)!important;color:var(--h-ink)!important}
.collapse{display:grid;grid-template-rows:0fr;transition:grid-template-rows .32s ease}
.collapse.open{grid-template-rows:1fr}
.collapse>div{overflow:hidden;min-height:0}
.calbody{padding-top:16px}
.calnav{display:flex;align-items:center;gap:8px;margin:14px 0 12px}
.calnav h3{flex:1;text-align:center;font-size:1rem}
.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;font-size:.75rem;color:var(--mute);text-align:center;margin-bottom:4px}
.month{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.month button{aspect-ratio:1;border:0;border-radius:10px;background:var(--h0);font-size:.85rem;font-variant-numeric:tabular-nums;cursor:pointer;color:var(--ink);padding:0;position:relative}
.month button.fut{background:transparent;color:var(--mute);cursor:default}
.month button.td{font-weight:700;outline:2px solid var(--accent);outline-offset:-2px}
.month button[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:1px}
.month .pad{visibility:hidden}
.year{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 12px}
.mini{display:flex;flex-direction:column;justify-content:flex-start;border:0;background:transparent;padding:6px;border-radius:10px;cursor:pointer;text-align:left;color:var(--ink)}
.mini:hover{background:var(--surface-2)}
.mini b{display:block;font-size:.8rem;margin-bottom:4px}
.mini .g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.mini .g i{aspect-ratio:1;border-radius:2px;background:var(--h0)}
.mini .g i.pad{background:transparent}
.mini .g i.fut{background:transparent;outline:1px solid var(--line);outline-offset:-1px}
.mini small{display:block;color:var(--mute);font-size:.72rem;margin-top:4px}
.legend{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:.75rem;color:var(--mute);margin-top:12px}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;padding:12px;background:var(--surface-2);border-radius:12px}
.sum b{display:block;font:600 1.25rem/1.2 Fraunces,Georgia,serif;font-variant-numeric:tabular-nums}
.sum small{font-size:.78rem;color:var(--mute)}
.daydet{margin-top:14px}
.weekbars svg{width:100%;height:auto;display:block}
.weekbars text{fill:var(--mute);font:11px Figtree,sans-serif}

/* progress */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stats div{background:var(--surface-2);border-radius:12px;padding:12px}
.stats b{display:block;font:600 1.6rem/1.15 Fraunces,Georgia,serif;font-variant-numeric:tabular-nums}
.stats small{color:var(--mute);font-size:.85rem}
.h{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:.95rem}
.h:first-child{border-top:0}
.h em{color:var(--mute);font-style:normal;font-size:.875rem}
.h>div:last-child{text-align:right;flex:none}
#chart svg text{fill:var(--mute);font:11px Figtree,sans-serif}

/* banner, toast */
.banner{background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:18px;padding:14px 16px;margin-bottom:12px}
.banner b{display:block}
.banner .row{margin-top:10px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.92rem;z-index:20;box-shadow:0 6px 20px rgba(0,0,0,.18);max-width:calc(100% - 32px)}

/* bottom tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs>div{max-width:600px;margin:0 auto;display:flex;gap:4px}
.tabs button{flex:1;border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;font-size:.72rem;font-weight:600;color:var(--mute);min-height:52px;border-radius:12px}
.tabs button svg{width:22px;height:22px;padding:2px 10px;box-sizing:content-box;border-radius:999px}
.tabs button[aria-selected="true"]{color:var(--ink)}
.tabs button[aria-selected="true"] svg{background:var(--surface-2)}

/* widget previews (product UI fragments) */
.lock{background:var(--night);color:var(--night-ink);border-radius:28px;padding:26px 16px 18px;text-align:center}
.lock-date{font-size:.95rem;font-weight:500;color:var(--night-mute)}
.lock-time{font:300 4.2rem/1 Figtree,sans-serif;letter-spacing:-.03em;margin:2px 0 16px;font-variant-numeric:tabular-nums}
.lock-w{display:flex;gap:10px;justify-content:center;align-items:stretch;margin-bottom:18px}
.w-circ{width:76px;height:76px;border-radius:50%;background:var(--night-2);position:relative;flex:none}
.w-circ svg.r{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.w-circ .lamp{position:absolute;left:50%;top:9px;width:34px;height:34px;transform:translateX(-50%)}
.w-circ b{position:absolute;left:0;right:0;bottom:12px;font-size:.95rem;font-variant-numeric:tabular-nums}
.w-rect{flex:1;max-width:200px;border-radius:20px;background:var(--night-2);padding:10px 12px;text-align:left;display:flex;gap:8px;align-items:center}
.w-rect .lamp{width:36px;height:36px;flex:none}
.w-rect b{display:block;font-size:.85rem;line-height:1.25}
.w-rect small{display:block;font-size:.75rem;color:var(--night-mute);line-height:1.3}
.w-rect .wb{height:4px;border-radius:3px;background:rgba(255,255,255,.18);margin-top:5px;overflow:hidden}
.w-rect .wb i{display:block;height:100%;background:var(--flame)}
.ncard{background:#f5f6f3;color:#171c1a;border-radius:20px;padding:12px 14px;text-align:left}
.ncard .nh{display:flex;align-items:center;gap:6px;font-size:.75rem;color:#5b625e}
.ncard .nh img{width:16px;height:16px;border-radius:4px}
.ncard .nb{display:flex;gap:10px;align-items:center;margin-top:6px}
.ncard .nb .lamp{width:38px;height:38px;flex:none}
.ncard strong{display:block;font-size:.95rem}
.ncard p{font-size:.85rem;color:#3d4440}
.ncard .na{display:flex;gap:6px;margin-top:10px}
.ncard .na span{flex:1;text-align:center;font-size:.82rem;font-weight:600;padding:7px 0;border-radius:999px;background:#e3e6e1;color:#1f4f46}
.home-w{display:flex;gap:12px;align-items:stretch}
.hw{width:150px;height:150px;border-radius:24px;background:var(--surface-2);padding:14px;display:flex;flex-direction:column;flex:none}
.hw .lamp{width:44px;height:44px}
.hw b{font:600 2rem/1 Fraunces,Georgia,serif;margin-top:auto;font-variant-numeric:tabular-nums}
.hw small{font-size:.78rem;color:var(--mute)}
.lamp .fl{transform-box:fill-box;transform-origin:50% 100%}
@media (prefers-reduced-motion:no-preference){
  .lamp .fl{animation:flick 3.2s ease-in-out infinite}
  .segs b,.bar i{transition:width .4s ease}
  .tabpanel{animation:rise .28s ease both}
}
@keyframes flick{0%,100%{transform:scale(1,1)}30%{transform:scale(.96,1.05)}60%{transform:scale(1.03,.95)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
ol.steps{margin:8px 0 0;padding-left:1.25em}
ol.steps li{margin:6px 0}
.status{display:flex;gap:8px;align-items:center;font-size:.9rem}
.status i{width:9px;height:9px;border-radius:50%;background:var(--line-2);flex:none}
.status.ok i{background:var(--accent)}.status.bad i{background:var(--err)}
.qrbox{background:#fff;padding:12px;border-radius:14px;display:inline-block}
@media (min-width:480px){.stats{grid-template-columns:repeat(4,1fr)}.year{grid-template-columns:repeat(4,1fr)}}

/* ===== template board only ===== */
.board{max-width:1680px;margin:0 auto;padding:40px 24px 80px}
.board>header{max-width:760px;margin-bottom:36px}
.board>header h1{font-size:2.4rem}
.board>header p{margin-top:10px;font-size:1.05rem;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(390px,1fr));gap:40px 28px;justify-items:center}
.shot{margin:0;width:390px}
.shot figcaption{margin-bottom:12px}
.shot figcaption h2{font-size:1.1rem}
.frame{width:390px;border-radius:36px;background:var(--bg);border:1px solid var(--line-2);overflow:hidden;display:flex;flex-direction:column}
.frame .app{padding:8px 16px 16px;flex:1;width:100%}
.frame .tabs{position:static}
.frame .lamp .fl{animation:none}
.tokens{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.tokens span{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--mute)}
.tokens i{width:22px;height:22px;border-radius:6px;border:1px solid var(--line)}
@media (max-width:440px){.grid{grid-template-columns:1fr}.shot,.frame{width:100%}.board{padding:24px 12px 60px}}
</style>
</head>
<body>
<main class="board">
  <header>
    <h1>Mindful Buddy UI template</h1>
    <p>Every screen of the practice companion as static markup, styled with the app's own tokens and components. No logic is included; copy any block into the app or another stack.</p>
    <div class="tokens">
      <span><i style="background:var(--bg)"></i>--bg</span><span><i style="background:var(--surface)"></i>--surface</span><span><i style="background:var(--surface-2)"></i>--surface-2</span><span><i style="background:var(--ink)"></i>--ink</span><span><i style="background:var(--mute)"></i>--mute</span><span><i style="background:var(--accent)"></i>--accent</span><span><i style="background:var(--ana)"></i>--ana</span><span><i style="background:var(--vip)"></i>--vip</span><span><i style="background:var(--met)"></i>--met</span><span><i style="background:var(--flame)"></i>--flame</span><span><i style="background:var(--h1)"></i>--h1</span><span><i style="background:var(--h2)"></i>--h2</span><span><i style="background:var(--h3)"></i>--h3</span><span><i style="background:var(--h4)"></i>--h4</span><span><i style="background:var(--night)"></i>--night</span>
    </div>
